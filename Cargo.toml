[package]
name = "yapdf"
description = "A minimal, keyboard-driven PDF viewer"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-annot = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-render = { workspace = true }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
chrono = { workspace = true, features = ["clock"] }
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
egui = { workspace = true, features = ["bytemuck", "default_fonts"] }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = "1"
