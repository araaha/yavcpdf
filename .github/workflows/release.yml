name: Release

# A tag such as v0.1.0 builds the Linux binary and publishes it as a release. Started by hand, it
# builds and uploads the same archive as a workflow artifact, and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    # The oldest supported image, as a binary runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          name="yapdf-${GITHUB_REF_NAME//\//-}-x86_64-linux"
          mkdir "$name"
          cp target/release/yapdf README.md yapdf.desktop LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz*
          if-no-files-found: error

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE.tar.gz" "$PACKAGE.tar.gz.sha256" --verify-tag --title "yapdf $GITHUB_REF_NAME" --generate-notes
